name: Cross platform build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
        build_type: [ Debug, Release ]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    # Sanitizers and coverage are GCC/Clang flags, covered by the Linux Debug job.
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      SANITIZERS: ""
      COVERAGE: "OFF"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: turtlebrowser/get-conan@main

    - name: Build
      run: ci/build.sh
    - name: Unit Test
      run: ci/unit-test.sh
    - name: Install
      run: ci/install.sh
    - name: Function Test
      run: ci/function-test.sh
    - name: Examples
      run: ci/examples.sh
    # `conan create` builds Release, regardless of the matrix.
    - name: Package
      if: matrix.build_type == 'Release'
      run: ci/package.sh
    - name: Package Test
      if: matrix.build_type == 'Release'
      run: ci/package-test.sh
