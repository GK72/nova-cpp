name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The steps are the stages of `ci/e2e.sh`, run on the checkout.
jobs:
  # Sanitizers and coverage.
  debug:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0      # Version bump check compares against the base branch
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: turtlebrowser/get-conan@main
    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake gcovr rpm

    - name: Version Bump Check
      run: ci/pre-checks.sh
    - name: Build
      run: ci/build.sh
    - name: Unit Test
      run: ci/unit-test.sh
    - name: Install
      run: ci/install.sh
    - name: Function Test
      run: ci/function-test.sh
    - name: Examples
      run: ci/examples.sh
    - name: Coverage
      run: ci/coverage.sh

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: build/coverage/*

    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: build/coverage/cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '80 90'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

  # What is shipped: tests on the release build, packages.
  release:
    runs-on: ubuntu-24.04

    env:
      BUILD_TYPE: Release
      SANITIZERS: ""
      COVERAGE: "OFF"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: turtlebrowser/get-conan@main
    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake gcovr rpm

    - name: Build
      run: ci/build.sh
    - name: Unit Test
      run: ci/unit-test.sh
    - name: Install
      run: ci/install.sh
    - name: Function Test
      run: ci/function-test.sh
    - name: Examples
      run: ci/examples.sh
    - name: Package
      run: ci/package.sh
    - name: RPM Test
      run: ci/rpm-test.sh
    - name: Package Test
      run: ci/package-test.sh
    - name: Summary
      run: ci/summary.sh
